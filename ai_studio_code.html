<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA LUXE — Sovereign AI & Creative Studio</title>
    <!-- Google Fonts: Kanit (Thai) & Cinzel (Luxury English Accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-obsidian: #080808;
            --bg-charcoal: #111111;
            --bg-card: rgba(20, 20, 20, 0.7);
            --gold-primary: #D4AF37;
            --gold-light: #F9E79F;
            --gold-dark: #8C6D23;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --gold-glow: rgba(212, 175, 55, 0.3);
            --border-gold: rgba(212, 175, 55, 0.35);
            --text-pearl: #F5F5F7;
            --text-muted: #A0A0A0;
            --sidebar-width: 320px;
            --canvas-width: 480px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-pearl);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(140, 109, 35, 0.05) 0%, transparent 40%);
        }

        /* Luxury Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0c0c0c; }
        ::-webkit-scrollbar-thumb { background: var(--border-gold); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-primary); }

        /* Top Navigation */
        header {
            height: 60px;
            background: rgba(14, 14, 14, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .brand-logo i {
            font-size: 22px;
            color: var(--gold-primary);
            filter: drop-shadow(0 0 8px var(--gold-glow));
        }

        .brand-logo h1 {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-gold);
            color: var(--gold-primary);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-icon:hover, .btn-icon.active {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        /* App Container Layout */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            position: relative;
            overflow: hidden;
        }

        /* Sidebar Style */
        aside.sidebar {
            width: var(--sidebar-width);
            background: rgba(12, 12, 12, 0.95);
            border-right: 1px solid var(--border-gold);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 18px;
            overflow-y: auto;
            transition: all 0.3s ease;
            z-index: 90;
        }

        aside.sidebar.collapsed {
            margin-left: calc(-1 * var(--sidebar-width));
        }

        .config-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 12px;
            color: var(--text-muted);
        }

        input[type="text"], input[type="password"], select, textarea {
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--text-pearl);
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        /* Main Chat Center */
        main.chat-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
            height: 100%;
            position: relative;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-row {
            display: flex;
            gap: 14px;
            max-width: 80%;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.ai {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            border: 1px solid var(--border-gold);
        }

        .user .msg-avatar {
            background: #222;
            color: var(--gold-primary);
        }

        .ai .msg-avatar {
            background: var(--gold-gradient);
            color: #000;
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .msg-bubble {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14.5px;
            line-height: 1.6;
            color: #f0f0f0;
            position: relative;
        }

        .user .msg-bubble {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-top-right-radius: 2px;
        }

        .ai .msg-bubble {
            border-top-left-radius: 2px;
            border-left: 2px solid var(--gold-primary);
        }

        .msg-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: var(--gold-light);
            font-size: 11.5px;
            padding: 3px 8px;
            border-radius: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .action-chip:hover {
            background: var(--gold-primary);
            color: #000;
        }

        /* Media Card */
        .media-preview-container {
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-gold);
            background: #000;
            position: relative;
        }

        .media-preview-container img, .media-preview-container video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Bottom Control Deck */
        .bottom-dock {
            padding: 15px 24px 20px 24px;
            background: rgba(10, 10, 10, 0.9);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dock-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .aspect-ratio-selector {
            display: flex;
            gap: 6px;
            background: rgba(20, 20, 20, 0.6);
            padding: 3px;
            border-radius: 6px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .ratio-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .ratio-btn.active {
            background: var(--gold-primary);
            color: #000;
            font-weight: 600;
        }

        .continuous-mode-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--gold-light);
            cursor: pointer;
        }

        .switch-toggle {
            position: relative;
            width: 34px;
            height: 18px;
            background: #252525;
            border-radius: 10px;
            border: 1px solid var(--border-gold);
            transition: 0.3s;
        }

        .switch-toggle::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #777;
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }

        input#toggleHandsFree:checked + .switch-toggle {
            background: var(--gold-dark);
        }

        input#toggleHandsFree:checked + .switch-toggle::after {
            left: 18px;
            background: var(--gold-light);
            box-shadow: 0 0 6px var(--gold-primary);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(22, 22, 22, 0.9);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 6px 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            resize: none;
            height: 42px;
            padding: 10px 4px;
            font-size: 14px;
            color: var(--text-pearl);
            outline: none;
        }

        .dock-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mic-btn.listening {
            background: #b22222 !important;
            color: #fff !important;
            animation: pulseRecord 1.5s infinite;
        }

        @keyframes pulseRecord {
            0% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(220, 20, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0); }
        }

        /* Right Canvas (Artifacts & Live Preview) */
        aside.canvas-panel {
            width: var(--canvas-width);
            background: rgba(14, 14, 14, 0.96);
            border-left: 1px solid var(--border-gold);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            z-index: 90;
        }

        aside.canvas-panel.collapsed {
            margin-right: calc(-1 * var(--canvas-width));
        }

        .canvas-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .canvas-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
        }

        iframe#livePreviewFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Mobile Adjustments */
        @media (max-width: 900px) {
            aside.sidebar {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            }
            aside.canvas-panel {
                position: absolute;
                top: 0;
                bottom: 0;
                right: 0;
                width: 100%;
                box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            }
            .message-row {
                max-width: 92%;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <header>
        <div class="brand-logo" onclick="toggleSidebar()">
            <i class="fa-solid fa-crown"></i>
            <h1>AURA LUXE</h1>
        </div>
        <div class="nav-controls">
            <button class="btn-icon" title="เปิด/ปิด การตั้งค่า" onclick="toggleSidebar()">
                <i class="fa-solid fa-sliders"></i>
            </button>
            <button class="btn-icon" id="canvasToggleBtn" title="เปิด/ปิด Interactive Live Canvas" onclick="toggleCanvas()">
                <i class="fa-solid fa-laptop-code"></i>
            </button>
        </div>
    </header>

    <div class="app-container">
        <!-- Left Sidebar: Settings & Personas -->
        <aside class="sidebar" id="sidebar">
            <div>
                <div class="config-title"><i class="fa-solid fa-robot"></i> บุคลิกและตัวตน AI</div>
                <div class="field-group">
                    <label>ชื่อเรียก AI ส่วนตัว</label>
                    <input type="text" id="aiNameInput" value="AURA Sovereign" placeholder="ตั้งชื่อ AI...">
                </div>
                <div class="field-group" style="margin-top: 8px;">
                    <label>ความเชี่ยวชาญ (Multi-Agent Persona)</label>
                    <select id="personaSelect">
                        <option value="general">✨ General Assistant (ผู้ช่วยรอบรู้ สุภาพ หรูหรา)</option>
                        <option value="coder">💻 Coding & App Builder (เขียนเว็บ/แอป ส่งโค้ดเข้า Canvas ทันที)</option>
                        <option value="prompt">🎨 Prompt & Creative Master (สร้างสูตร Prompt ขั้นสูง)</option>
                        <option value="marketing">🚀 Content & Marketing Pro (สคริปต์สั้น คอนเทนต์ปัง)</option>
                    </select>
                </div>
            </div>

            <div>
                <div class="config-title"><i class="fa-solid fa-key"></i> ผู้ให้บริการ AI & API Keys</div>
                <div class="field-group">
                    <label>เอนจินหลัก (Primary LLM)</label>
                    <select id="llmEngineSelect">
                        <option value="gemini">Google Gemini 2.5 Flash</option>
                        <option value="groq">Groq (Llama 3.3 70B / Fast Inference)</option>
                    </select>
                </div>
                <div class="field-group" style="margin-top: 8px;">
                    <label>Gemini API Key</label>
                    <input type="password" id="geminiApiKey" placeholder="AIzaSy...">
                </div>
                <div class="field-group" style="margin-top: 8px;">
                    <label>Groq API Key (สำรอง)</label>
                    <input type="password" id="groqApiKey" placeholder="gsk_...">
                </div>
            </div>

            <div>
                <div class="config-title"><i class="fa-solid fa-microphone-lines"></i> เสียงสังเคราะห์ (TTS Speech)</div>
                <div class="field-group">
                    <label>เลือกเสียงพูด (Thai / English)</label>
                    <select id="ttsVoiceSelect">
                        <option value="">กำลังค้นหาเสียงในระบบ...</option>
                    </select>
                </div>
            </div>

            <div style="margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(212, 175, 55, 0.2);">
                <button class="action-chip" style="width: 100%; justify-content: center; padding: 8px 0;" onclick="clearChatHistory()">
                    <i class="fa-solid fa-trash-can"></i> ล้างประวัติการสนทนาทั้งหมด
                </button>
            </div>
        </aside>

        <!-- Center: Interactive Chat Interface -->
        <main class="chat-zone">
            <div class="chat-messages" id="chatMessages">
                <!-- Welcome greeting injected by JS -->
            </div>

            <!-- Bottom Dock -->
            <div class="bottom-dock">
                <div class="dock-toolbar">
                    <div class="aspect-ratio-selector">
                        <button class="ratio-btn active" data-ratio="1:1" onclick="setAspectRatio('1:1', this)">1:1 Square</button>
                        <button class="ratio-btn" data-ratio="9:16" onclick="setAspectRatio('9:16', this)">9:16 Reels</button>
                        <button class="ratio-btn" data-ratio="16:9" onclick="setAspectRatio('16:9', this)">16:9 Cinema</button>
                    </div>

                    <label class="continuous-mode-pill" title="โหมดคุยเสียงต่อเนื่อง AI พูดจบ ไมค์จะเปิดรับคำสั่งถัดไปทันที">
                        <input type="checkbox" id="toggleHandsFree" style="display: none;">
                        <div class="switch-toggle"></div>
                        <span>Hands-Free Auto Voice</span>
                    </label>
                </div>

                <div class="input-wrapper">
                    <textarea id="promptInput" placeholder="พิมพ์คำสั่ง, สอบถามโค้ด หรือพิมพ์ '/draw [รายละเอียด]' เพื่อวาดภาพ..." rows="1"></textarea>
                    <div class="dock-actions">
                        <button class="btn-icon mic-btn" id="micBtn" title="กดเพื่อสั่งงานด้วยเสียง" onclick="toggleSpeechRecognition()">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                        <button class="btn-icon" style="background: var(--gold-primary); color: #000;" title="ส่งคำสั่ง" onclick="handleSend()">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Side: Live Interactive Canvas (Artifacts) -->
        <aside class="canvas-panel collapsed" id="canvasPanel">
            <div class="canvas-header">
                <div style="font-size: 13.5px; font-weight: 500; color: var(--gold-light); display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-bolt" style="color: var(--gold-primary);"></i> Live Artifact Preview
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="action-chip" title="Copy Code" onclick="copyCanvasCode()"><i class="fa-regular fa-copy"></i> Copy</button>
                    <button class="action-chip" title="Download .html" onclick="downloadCanvasFile()"><i class="fa-solid fa-download"></i> Save</button>
                    <button class="action-chip" onclick="toggleCanvas()"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="canvas-body">
                <iframe id="livePreviewFrame" sandbox="allow-scripts allow-modals"></iframe>
            </div>
        </aside>
    </div>

    <!-- Application Script -->
    <script>
        // State Management
        let appState = {
            aiName: localStorage.getItem('aura_ai_name') || 'AURA Sovereign',
            persona: localStorage.getItem('aura_persona') || 'general',
            llmEngine: localStorage.getItem('aura_engine') || 'gemini',
            geminiKey: localStorage.getItem('aura_gemini_key') || '',
            groqKey: localStorage.getItem('aura_groq_key') || '',
            aspectRatio: '1:1',
            chatHistory: JSON.parse(localStorage.getItem('aura_chat_history') || '[]'),
            latestCodeArtifact: '',
            isListening: false
        };

        const personasSystemPrompts = {
            general: `คุณคือ AI ส่วนตัวระดับไฮเอนด์ มีชื่อว่า "{{AI_NAME}}" โทนการพูดจาสุภาพ ฉลาด มีระดับ หรูหรา เรียบร้อย คอยช่วยเหลือและแก้ปัญหาทุกเรื่องอย่างแม่นยำรอบคอบ`,
            coder: `คุณคือ Expert Software Architect & Full-stack Web Builder ชั้นนำ เมื่อได้รับคำขอให้สร้างแอป/เว็บเพจ คุณต้องส่งโค้ด HTML/CSS/JavaScript รวมครบถ้วนสมบูรณ์ในกล่อง code block ภาษา html (\`\`\`html ... \`\`\`) โดยตรงเสมอ เพื่อให้ระบบนำไปเรนเดอร์ใน Live Preview Canvas ได้ทันที`,
            prompt: `คุณคือ Prompt & Creative Director มือหนึ่ง คอยปรับเกลาและสร้าง Prompt สำหรับ Image & Video Diffusion Model (เช่น Midjourney, Pollinations, Flux) โดยเน้นแต่ง Prompt ภาษาอังกฤษที่ลงลึกเรื่อง Composition, Lighting, Lens, Style ให้สมบูรณ์แบบ`,
            marketing: `คุณคือที่ปรึกษาด้าน Content Marketing และ TikTok/Reels Growth Hacker เชี่ยวชาญการเขียนสคริปต์วิดีโอสั้นที่มี Hook ทรงพลัง, Call to Action, และการวางโครงสร้างปักตะกร้าขายของอย่างได้ผลลัพธ์สูงสุด`
        };

        // DOM Elements
        const chatMessages = document.getElementById('chatMessages');
        const promptInput = document.getElementById('promptInput');
        const sidebar = document.getElementById('sidebar');
        const canvasPanel = document.getElementById('canvasPanel');
        const livePreviewFrame = document.getElementById('livePreviewFrame');
        const micBtn = document.getElementById('micBtn');
        const toggleHandsFree = document.getElementById('toggleHandsFree');
        const ttsVoiceSelect = document.getElementById('ttsVoiceSelect');

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            initSettingsUI();
            initSpeechSynthesis();
            renderChatHistory();

            // Auto-resize textarea
            promptInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });
        });

        function initSettingsUI() {
            document.getElementById('aiNameInput').value = appState.aiName;
            document.getElementById('personaSelect').value = appState.persona;
            document.getElementById('llmEngineSelect').value = appState.llmEngine;
            document.getElementById('geminiApiKey').value = appState.geminiKey;
            document.getElementById('groqApiKey').value = appState.groqKey;

            document.getElementById('aiNameInput').onchange = (e) => {
                appState.aiName = e.target.value;
                localStorage.setItem('aura_ai_name', appState.aiName);
            };
            document.getElementById('personaSelect').onchange = (e) => {
                appState.persona = e.target.value;
                localStorage.setItem('aura_persona', appState.persona);
            };
            document.getElementById('llmEngineSelect').onchange = (e) => {
                appState.llmEngine = e.target.value;
                localStorage.setItem('aura_engine', appState.llmEngine);
            };
            document.getElementById('geminiApiKey').onchange = (e) => {
                appState.geminiKey = e.target.value.trim();
                localStorage.setItem('aura_gemini_key', appState.geminiKey);
            };
            document.getElementById('groqApiKey').onchange = (e) => {
                appState.groqKey = e.target.value.trim();
                localStorage.setItem('aura_groq_key', appState.groqKey);
            };
        }

        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
        }

        function toggleCanvas(forceState) {
            if (forceState !== undefined) {
                canvasPanel.classList.toggle('collapsed', !forceState);
            } else {
                canvasPanel.classList.toggle('collapsed');
            }
        }

        function setAspectRatio(ratio, element) {
            appState.aspectRatio = ratio;
            document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }

        /* ------------------ Speech & TTS Engine ------------------ */
        let synth = window.speechSynthesis;
        let availableVoices = [];

        function initSpeechSynthesis() {
            function loadVoices() {
                availableVoices = synth.getVoices();
                ttsVoiceSelect.innerHTML = '';
                const filtered = availableVoices.filter(v => v.lang.startsWith('th') || v.lang.startsWith('en'));
                
                filtered.forEach((voice, index) => {
                    const opt = document.createElement('option');
                    opt.value = voice.name;
                    opt.textContent = `${voice.name} (${voice.lang})`;
                    if (voice.lang.includes('th') && !ttsVoiceSelect.value) opt.selected = true;
                    ttsVoiceSelect.appendChild(opt);
                });
            }
            loadVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }
        }

        function speakText(text, onCompleteCallback) {
            if (!text) return;
            synth.cancel();

            // Remove markdown code fences & urls before vocalization
            let cleanSpeech = text.replace(/```[\s\S]*?```/g, 'มีโค้ดตัวอย่างในกล่องแคนวาสครับ')
                                .replace(/https?:\/\/\S+/g, 'ลิงก์แนบ');

            const utterance = new SpeechSynthesisUtterance(cleanSpeech);
            const selectedVoice = availableVoices.find(v => v.name === ttsVoiceSelect.value);
            if (selectedVoice) utterance.voice = selectedVoice;

            utterance.onend = () => {
                if (onCompleteCallback) onCompleteCallback();
                if (toggleHandsFree.checked) {
                    startSpeechRecognition();
                }
            };
            synth.speak(utterance);
        }

        /* ------------------ STT Speech Recognition ------------------ */
        let recognition = null;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'th-TH';

            recognition.onstart = () => {
                appState.isListening = true;
                micBtn.classList.add('listening');
            };

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                promptInput.value = transcript;
                handleSend();
            };

            recognition.onerror = () => stopSpeechRecognition();
            recognition.onend = () => stopSpeechRecognition();
        }

        function toggleSpeechRecognition() {
            if (appState.isListening) {
                stopSpeechRecognition();
            } else {
                startSpeechRecognition();
            }
        }

        function startSpeechRecognition() {
            if (!recognition) {
                alert('เบราว์เซอร์ของคุณยังไม่รองรับ Web Speech API');
                return;
            }
            synth.cancel();
            try { recognition.start(); } catch(e){}
        }

        function stopSpeechRecognition() {
            appState.isListening = false;
            micBtn.classList.remove('listening');
            try { recognition.stop(); } catch(e){}
        }

        /* ------------------ Chat & Send Handler ------------------ */
        async function handleSend() {
            const rawText = promptInput.value.trim();
            if (!rawText) return;

            promptInput.value = '';
            appendMessage('user', rawText);

            // Handle Draw Command Directly (/draw or วาดรูป)
            if (rawText.startsWith('/draw ') || rawText.startsWith('วาดรูป') || rawText.startsWith('สร้างรูปภาพ')) {
                const imagePrompt = rawText.replace(/\/draw|วาดรูป|สร้างรูปภาพ/gi, '').trim();
                await handleImageGeneration(imagePrompt || 'Luxury black obsidian crystal with gold veins');
                return;
            }

            // Call Selected AI Engine
            appendMessage('ai', '...', true);
            try {
                let aiResponse = '';
                if (appState.llmEngine === 'gemini') {
                    aiResponse = await callGeminiAPI(rawText);
                } else {
                    aiResponse = await callGroqAPI(rawText);
                }
                
                removeLoadingMessage();
                appendMessage('ai', aiResponse);
                extractAndRenderCodeArtifacts(aiResponse);
                
                // Voice reading
                speakText(aiResponse);
            } catch (err) {
                removeLoadingMessage();
                appendMessage('ai', `⚠️ เกิดข้อผิดพลาด: ${err.message}\nโปรดตรวจสอบ API Key ในแผงตั้งค่าด้านซ้าย`);
            }
        }

        /* ------------------ LLM API Connectors ------------------ */
        async function callGeminiAPI(userQuery) {
            if (!appState.geminiKey) {
                throw new Error('ยังไม่ได้ใส่ Google Gemini API Key');
            }

            const activePersonaInstruction = personasSystemPrompts[appState.persona].replace('{{AI_NAME}}', appState.aiName);
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${appState.geminiKey}`;

            const payload = {
                systemInstruction: { parts: [{ text: activePersonaInstruction }] },
                contents: [
                    ...appState.chatHistory.slice(-6).map(m => ({
                        role: m.sender === 'user' ? 'user' : 'model',
                        parts: [{ text: m.text }]
                    })),
                    { role: 'user', parts: [{ text: userQuery }] }
                ]
            };

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.error?.message || 'Gemini API Error');
            }

            const data = await res.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || 'ไม่มีข้อมูลตอบกลับ';
        }

        async function callGroqAPI(userQuery) {
            if (!appState.groqKey) {
                throw new Error('ยังไม่ได้ใส่ Groq API Key');
            }

            const activePersonaInstruction = personasSystemPrompts[appState.persona].replace('{{AI_NAME}}', appState.aiName);
            const endpoint = 'https://api.groq.com/openai/v1/chat/completions';

            const messages = [
                { role: 'system', content: activePersonaInstruction },
                ...appState.chatHistory.slice(-6).map(m => ({
                    role: m.sender === 'user' ? 'user' : 'assistant',
                    content: m.text
                })),
                { role: 'user', content: userQuery }
            ];

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${appState.groqKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: messages
                })
            });

            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.error?.message || 'Groq API Error');
            }

            const data = await res.json();
            return data.choices?.[0]?.message?.content || 'ไม่มีข้อมูลตอบกลับ';
        }

        /* ------------------ Media Studio (Pollinations) ------------------ */
        async function handleImageGeneration(prompt) {
            appendMessage('ai', `🎨 กำลังสร้างภาพความละเอียดสูงในอัตราส่วน ${appState.aspectRatio}...`);
            
            let width = 1024, height = 1024;
            if (appState.aspectRatio === '9:16') { width = 720; height = 1280; }
            if (appState.aspectRatio === '16:9') { width = 1280; height = 720; }

            const cleanPrompt = encodeURIComponent(prompt + ", ultra luxury black and gold tone, 8k, photorealistic");
            const seed = Math.floor(Math.random() * 999999);
            const imageUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true`;

            const imageCardHTML = `
                <div>
                    <div>ได้สร้างรูปภาพตามโจทย์: <i>"${prompt}"</i></div>
                    <div class="media-preview-container">
                        <img src="${imageUrl}" alt="AI Generated Image" loading="lazy">
                    </div>
                    <div class="msg-actions">
                        <a href="${imageUrl}" target="_blank" download="image.jpg" class="action-chip"><i class="fa-solid fa-download"></i> โหลดภาพเต็ม</a>
                        <button class="action-chip" onclick="handleVideoGeneration('${prompt}')"><i class="fa-solid fa-film"></i> ขยายเป็นวิดีโอ (Send to Video)</button>
                    </div>
                </div>
            `;
            appendMessage('ai', imageCardHTML, false, true);
        }

        function handleVideoGeneration(prompt) {
            appendMessage('ai', `🎬 กำลังประมวลผลโมชันวิดีโอ...`);
            const encoded = encodeURIComponent(prompt);
            const videoUrl = `https://video.pollinations.ai/prompt/${encoded}`;

            const videoCardHTML = `
                <div>
                    <div>วิดีโอโมชัน: <i>"${prompt}"</i></div>
                    <div class="media-preview-container">
                        <video controls autoplay loop muted playsinline>
                            <source src="${videoUrl}" type="video/mp4">
                            เบราว์เซอร์ไม่รองรับแท็กวิดีโอ
                        </video>
                    </div>
                </div>
            `;
            appendMessage('ai', videoCardHTML, false, true);
        }

        /* ------------------ Code Artifact Extractor & Live Preview ------------------ */
        function extractAndRenderCodeArtifacts(aiMessage) {
            const htmlBlockRegex = /```html([\s\S]*?)```/i;
            const match = aiMessage.match(htmlBlockRegex);

            if (match && match[1]) {
                const extractedHtml = match[1].trim();
                appState.latestCodeArtifact = extractedHtml;
                livePreviewFrame.srcdoc = extractedHtml;
                toggleCanvas(true); // Open canvas automatically
            }
        }

        function copyCanvasCode() {
            if (!appState.latestCodeArtifact) return alert('ยังไม่มีโค้ดในระบบ');
            navigator.clipboard.writeText(appState.latestCodeArtifact);
            alert('คัดลอกโค้ดเรียบร้อยแล้ว');
        }

        function downloadCanvasFile() {
            if (!appState.latestCodeArtifact) return alert('ยังไม่มีโค้ดสำหรับดาวน์โหลด');
            const blob = new Blob([appState.latestCodeArtifact], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'aura-app.html';
            a.click();
        }

        /* ------------------ UI Message Rendering ------------------ */
        function appendMessage(sender, content, isLoading = false, isRawHTML = false) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;
            if (isLoading) row.id = 'loadingIndicator';

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.innerHTML = sender === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-crown"></i>';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            if (isRawHTML) {
                bubble.innerHTML = content;
            } else if (isLoading) {
                bubble.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังประมวลผลความคิด...`;
            } else {
                bubble.innerText = content;
                // Add Quick Audio Trigger for AI
                if (sender === 'ai') {
                    const actions = document.createElement('div');
                    actions.className = 'msg-actions';
                    actions.innerHTML = `
                        <button class="action-chip" onclick="speakText(\`${content.replace(/`/g, "\\`").replace(/"/g, '&quot;')}\`)">
                            <i class="fa-solid fa-volume-high"></i> ฟังเสียง
                        </button>
                    `;
                    bubble.appendChild(actions);
                }
            }

            row.appendChild(avatar);
            row.appendChild(bubble);
            chatMessages.appendChild(row);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (!isLoading && !isRawHTML) {
                appState.chatHistory.push({ sender, text: content });
                localStorage.setItem('aura_chat_history', JSON.stringify(appState.chatHistory));
            }
        }

        function removeLoadingMessage() {
            const el = document.getElementById('loadingIndicator');
            if (el) el.remove();
        }

        function renderChatHistory() {
            chatMessages.innerHTML = '';
            if (appState.chatHistory.length === 0) {
                appendMessage('ai', `ยินดีต้อนรับสู่ AURA LUXE ระบบ AI ส่วนตัวระดับพรีเมียม\nฉันพร้อมช่วยเหลือคุณทั้งการสร้างโค้ดสำหรับรันสดใน Canvas, วาดภาพความละเอียดสูง (พิมพ์ /draw), สคริปต์การตลาด หรือคุยโต้ตอบด้วยเสียง`);
                return;
            }
            appState.chatHistory.forEach(msg => appendMessage(msg.sender, msg.text));
        }

        function clearChatHistory() {
            if (confirm('คุณต้องการล้างประวัติการสนทนาทั้งหมดใช่หรือไม่?')) {
                appState.chatHistory = [];
                localStorage.removeItem('aura_chat_history');
                renderChatHistory();
            }
        }
    </script>
</body>
